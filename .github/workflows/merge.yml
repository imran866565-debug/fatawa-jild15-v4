name: Merge Jild 15 tashreeh v4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild15_v4.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json, re
          import merge_jild15_v4 as m
          d = json.load(open('jild-15.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', sum(1 for it in items if not it.get('tashreeh_jawab')))
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('first id:', items[0]['id'])
          print('last id:', items[-1]['id'])
          exceptions = sorted(it['id'] for it in items if it.get('start_page') != min(it['pages']))
          print('start_page exceptions:', exceptions)
          raw = open('jild-15.json', encoding='utf-8').read()
          SAFHA = "\u0635\u0641\u062d\u06c1"
          LENT = "\u3010" + SAFHA
          print('lenticular markers remaining:', raw.count(LENT))
          print('short markers remaining:', len(re.findall(r"\[\u0635 \d+\]", raw)))
          print('[safha N] markers total:', len(re.findall(r"\[" + SAFHA + r" \d+\]", raw)))
          # Independent re-check of the exact v3 identity (lists embedded in merge script).
          ids = [it['id'] for it in items]
          assert ids == list(m.V3_IDS), 'ID sequence != v3'
          for it in items:
              assert it['pages'] == m.V3_PAGES[it['id']], f"{it['id']}: pages != v3"
          assert len(items) == 222
          assert len(pages) == 662
          assert min(pages) == 4 and max(pages) == 742
          assert len(set(it['id'] for it in items)) == len(items)
          assert all(it.get('tashreeh_jawab') for it in items)
          assert sorted(set(it.get('volume_id') for it in items)) == [51]
          assert exceptions == []
          assert items[0]['id'] == 'jild15-pesh-lafz'
          assert items[-1]['id'] == 'jild15-p740-taqriz'
          assert LENT not in raw
          assert not re.search(r"\[\u0635 \d+\]", raw)
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la jild-15.json
          gh release create v1.0 jild-15.json --title "Jild 15 tashreeh v4 - merged" --notes "Merged easy-Urdu tashreeh v4 for Fatawa Razviya Jild 15: 222 items, 662 pages (volume_id 51). Generated by merge_jild15_v4.py from the 15 leaf chunk files in order 01, 02, 03a, 03b, 04a, 04b, 05a, 05b, 05c, 06, 07, 08, 09, 10, 11 (masala-72 joined from leaves 05a+05b+05c, masala-74 joined from leaves 06+07); item order reproduces the v3 merged file exactly (first jild15-pesh-lafz, last jild15-p740-taqriz). all 15 leaf chunks carry start_page == min(pages). No masala number is duplicated in this jild; the merge renames nothing. No page markers present in the chunks." || gh release upload v1.0 jild-15.json --clobber
